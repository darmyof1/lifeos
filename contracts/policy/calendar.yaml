# contracts/policy/calendar.yaml
# Status: draft. Approvals: APR-0030 (writer), APR-0031 (store), APR-0032 (content), APR-0034 (naming), APR-0035 (naming details).
schema_version: "1.0"
status: draft
writer: cos                          # APR-0030: only CoS writes calendar entries
store: google_calendar               # APR-0031
google_content:
  mode: titles_only                  # APR-0032: change by a new APR entry
  stored_fields: [title, start, end]
  kept_local: [details, location, attendees, health notes, family notes]
  high_privacy_title: "busy"         # APR-0032, option a
# APR-0116, APR-0119. The two lines below are read by scripts/gcal/gcal_sync.py from the repo copy of this file.
# Change a value by editing the line, pushing, and the VM pulling (no restart needed; the next 5-minute run applies it).
privacy_display: busy                # busy (default, safe): entries marked privacy=high show in Google as "busy".
                                     # full: they show with the real title. Events already in Google are changed on the next run, in
                                     # either direction (never recreated). Any other, missing or unreadable value means busy.
calendar_target: test                # test (default): the job writes to GCAL_CALENDAR (the Google TEST calendar).
                                     # real: the job writes to GCAL_CALENDAR_REAL; with no real ID set it refuses and writes nothing.
                                     # NOT AUTHORIZED: real stays off until a separate APR (ops/calendar-switch.md).
naming:                              # APR-0034 (interpretation: APR-0035, meanings APR-0037)
  format: "<DOMAIN> - <Title> - <MMDDYYYY>-<NNNN>"
  example: "CHO - Doctor Appointment - 10202026-0001"
  domain_codes: [CHO, CSP, CDO, CFO, CFA, CLO, CSO, CCO]
  # APR-0037: CHO Health, CSP Spirituality, CDO Development, CFO Finance, CFA Family,
  #           CLO Lifestyle, CSO Social, CCO Career.
  non_domain_codes: [COO, COS]
  date_order: MMDDYYYY               # APR-0035
  id_scope: per_date                 # APR-0035: restarts each day
  id_digits: 4
  assigned_by: cos
